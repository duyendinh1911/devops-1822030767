name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Kiểm tra tính hợp lệ của mã nguồn
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Kiểm tra sự tồn tại của 3 file bắt buộc
        run: |
          if [ ! -f index.html ] || [ ! -f style.css ] || [ ! -f script.js ]; then
            echo "Lỗi: Thiếu một trong các file index.html, style.css, script.js!"
            exit 1
          fi
          echo "Đã đủ 3 file index.html, style.css, script.js"

      - name: Kiểm tra thẻ <title> trong file index.html
        run: |
          if ! grep -i -q "<title>" index.html; then
            echo "Lỗi: index.html không chứa thẻ <title>!"
            exit 1
          fi
          echo "Kiểm tra thẻ <title> thành công!"

  # Job 2: Deploy lên GitHub Pages (chỉ chạy khi job check thành công)
  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4